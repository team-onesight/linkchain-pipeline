[project]
name = "linkchain-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow-providers-amazon>=9.18.1",
    "pandas>=2.3.3",
    "apache-airflow-providers-snowflake>=5.3.0",
    "scrapetube>=2.6.0",
    "playwright>=1.57.0",
    "psycopg2-binary>=2.9.11",
    "apache-airflow-providers-postgres>=6.5.1",
    "apache-airflow-providers-standard>=0.0.2",
    "polars>=1.36.1",
    "trafilatura>=2.0.0",
    "numpy>=2.2.6",
    "astronomer-cosmos>=1.12.0",
    "sentence-transformers>=5.2.0",
    "keybert>=0.9.0",
    "mecab-python3>=1.0.12",
    "mecab-ko-dic>=1.0.0",
    "bs4>=0.0.2",
]

[dependency-groups]

dev = [
    "ansible>=13.1.0",
    "apache-airflow==3.1.2",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
