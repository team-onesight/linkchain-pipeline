name: Deploy Airflow with Ansible

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies with uv
        run: uv sync --only-group deploy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY_ID }}
          aws-region: ap-northeast-2

      - name: Create SSH key file
        working-directory: ansible
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Run Ansible Playbook
        run: |
          uv run --only-group deploy ansible-playbook -i aws_ec2.yml deploy_airflow.yml --extra-vars "bastion_host=${{ secrets.EC2_HOST }}" --private-key private_key.pem
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'False'
        
